<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Store</title>
    <!-- Tailwind CSS for rapid styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- === CUSTOM STYLES === -->
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #0f172a; /* Nexus Dark Slate */
            color: #f8fafc; /* Light text */
        }
        /* Hide scrollbar for a cleaner look in specific containers if needed */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>
<body class="flex flex-col min-h-screen relative bg-slate-900 text-slate-200">

    <!-- === BACKGROUND LAYER === -->
    <!-- Deep dark background -->
    <div class="fixed inset-0 z-[-1] bg-slate-950 pointer-events-none"></div>

    <!-- === HEADER NAVIGATION === -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 shadow-sm">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center gap-4">
            <div class="flex items-center gap-3 cursor-pointer whitespace-nowrap" id="logo-btn">
                <div class="w-10 h-10 rounded-[12px] bg-gradient-to-tr from-violet-700 via-fuchsia-600 to-pink-500 flex items-center justify-center shadow-[0_0_15px_rgba(192,38,211,0.3)]">
                    <i class="fa-solid fa-play text-white text-base ml-1"></i>
                </div>
                <div class="text-2xl font-bold tracking-tight">
                    <span class="text-white">Nexus</span><span class="text-indigo-400">Store</span>
                </div>
            </div>
            
            <!-- Google Play style Search Bar (Nexus colors) -->
            <div class="hidden md:flex flex-grow max-w-2xl mx-4">
                <div class="relative w-full text-slate-400 focus-within:text-white">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 transform -translate-y-1/2"></i>
                    <input type="text" placeholder="Search for apps & games" class="w-full bg-slate-800 hover:bg-slate-700 focus:bg-slate-950 focus:shadow-md focus:outline-none transition-all duration-200 rounded-full py-2.5 pl-12 pr-4 text-white border border-transparent focus:border-cyan-500">
                </div>
            </div>

            <!-- Auth/User Controls Placeholder -->
            <div id="auth-controls-container" class="flex items-center gap-4">
                <i class="fa-regular fa-circle-question text-slate-400 text-xl cursor-pointer hover:text-white hover:bg-slate-800 p-2 rounded-full transition-colors hidden sm:block"></i>
                <div class="w-8 h-8 rounded-full bg-cyan-500 text-slate-900 flex items-center justify-center font-bold cursor-pointer hover:bg-cyan-400 transition-colors shadow-[0_0_10px_rgba(34,211,238,0.4)]">U</div>
            </div>
        </div>
        
        <!-- Secondary Nav Tabs -->
        <div class="container mx-auto px-4">
            <nav class="flex gap-6 text-sm font-medium text-slate-400">
                <button class="py-3 text-cyan-400 border-b-2 border-cyan-400 hover:text-cyan-300 transition-colors">Games</button>
                <button class="py-3 hover:text-white transition-colors border-b-2 border-transparent">Apps</button>
                <button class="py-3 hover:text-white transition-colors border-b-2 border-transparent">Kids</button>
            </nav>
        </div>
    </header>

    <!-- === MAIN CONTENT AREA === -->
    <main class="flex-grow container mx-auto px-4 py-8 flex flex-col items-center">
        
        <!-- View Containers - Only one should be visible at a time -->

        <!-- === AUTHENTICATION UI === -->
        <div id="view-auth" class="hidden w-full max-w-md bg-slate-800 rounded-2xl p-8 border border-slate-700 shadow-xl mt-10">
            <div class="flex justify-center mb-6">
                <div class="w-12 h-12 rounded-[14px] bg-gradient-to-tr from-violet-700 via-fuchsia-600 to-pink-500 flex items-center justify-center shadow-[0_0_15px_rgba(192,38,211,0.4)]">
                    <i class="fa-solid fa-play text-white text-xl ml-1"></i>
                </div>
            </div>
            <h2 class="text-2xl font-bold text-white mb-6 text-center" id="auth-title">Sign in to Nexus</h2>
            <form id="auth-form" class="flex flex-col gap-4">
                <input type="email" id="auth-email" placeholder="Email Address" class="w-full bg-slate-900 text-white rounded-lg px-4 py-3 border border-slate-700 focus:border-cyan-500 focus:outline-none transition-colors" required>
                <input type="password" id="auth-password" placeholder="Password" class="w-full bg-slate-900 text-white rounded-lg px-4 py-3 border border-slate-700 focus:border-cyan-500 focus:outline-none transition-colors" required>
                <button type="submit" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-900 font-bold py-3 rounded-lg mt-2 transition-colors shadow-[0_0_10px_rgba(34,211,238,0.2)]" id="auth-submit-btn">Login</button>
            </form>
            <div id="auth-error" class="text-red-400 text-sm mt-4 text-center hidden bg-red-400/10 py-2 rounded border border-red-500/20"></div>
            <div class="mt-6 text-center text-slate-400 text-sm">
                <span id="auth-toggle-text">Don't have an account?</span> 
                <button id="auth-toggle-btn" class="text-cyan-400 hover:text-cyan-300 font-medium ml-1">Sign up</button>
            </div>
        </div>
        
        <!-- === STOREFRONT UI === -->
        <div id="view-storefront" class="w-full max-w-6xl w-full flex flex-col gap-6">
            <!-- Search and Filter Bar Placeholder -->
            
            <!-- Featured App Placeholder -->
            
            <!-- App Grid Placeholder -->
            <div class="text-center text-slate-500 mt-10">
                 Storefront grid will go here...
            </div>
        </div>

        <!-- === APP UPLOAD UI === -->
        <div id="view-upload" class="hidden w-full max-w-2xl bg-slate-800 rounded-2xl p-8 border border-slate-700 shadow-xl">
             <div class="text-center text-slate-500">
                 Upload form will go here...
             </div>
        </div>

        <!-- === APP PLAYER UI === -->
        <div id="view-player" class="hidden w-full max-w-5xl flex flex-col gap-4">
             <div class="text-center text-slate-500 mt-10">
                 App player and details will go here...
             </div>
        </div>

    </main>

    <!-- === FOOTER === -->
    <footer class="bg-slate-950 border-t border-slate-800 py-6 text-center text-slate-500 text-sm">
        <p>&copy; 2026 Nexus Store. All rights reserved.</p>
    </footer>

    <!-- === TOAST NOTIFICATIONS === -->
    <div id="toast-container" class="fixed bottom-4 right-4 flex flex-col gap-2 z-50"></div>

    <!-- === FIREBASE SETUP === -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, onSnapshot, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration provided by user
        const firebaseConfig = {
            apiKey: ["AIzaSyCj0dXBXU_kE", "lLsrTZBpHYk232hPGO62ho"].join(''),
            authDomain: "app-store-e4605.firebaseapp.com",
            projectId: "app-store-e4605",
            storageBucket: "app-store-e4605.firebasestorage.app",
            messagingSenderId: "69260653568",
            appId: "1:69260653568:web:4381084078ddecdffd54e5",
            measurementId: "G-KYY1FTGSQ1"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Make global for other scripts to access
        window.db = db;
        window.auth = auth;
        window.collection = collection;
        window.getDocs = getDocs;
        window.signInAnonymously = signInAnonymously;
        window.signInWithCustomToken = signInWithCustomToken;
        window.signInWithEmailAndPassword = signInWithEmailAndPassword;
        window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
        window.signOut = signOut;
        window.onAuthStateChanged = onAuthStateChanged;

        console.log("Firebase Initialized.");
    </script>

    <!-- === JAVASCRIPT LOGIC === -->
    <script>
        
        // --- STATE MANAGEMENT ---
        const state = {
            currentUser: null, // null means not logged in
            apps: [],          // Will hold the list of apps
            currentView: 'storefront' // 'storefront', 'upload', 'player'
        };

        // --- DOM ELEMENTS ---
        const views = {
            auth: document.getElementById('view-auth'),
            storefront: document.getElementById('view-storefront'),
            upload: document.getElementById('view-upload'),
            player: document.getElementById('view-player')
        };
        const logoBtn = document.getElementById('logo-btn');
        const authControlsContainer = document.getElementById('auth-controls-container');
        const toastContainer = document.getElementById('toast-container');

        // --- VIEW NAVIGATION ---
        function switchView(viewName) {
            // Hide all views
            Object.values(views).forEach(el => el.classList.add('hidden'));
            
            // Show requested view
            if (views[viewName]) {
                views[viewName].classList.remove('hidden');
                state.currentView = viewName;
                
                // Specific view logic
                if (viewName === 'storefront') {
                    renderStorefront();
                }
            } else {
                console.error(`View "${viewName}" not found.`);
            }
        }

        // --- RENDER FUNCTIONS ---
        async function renderStorefront() {
            // Show a loading state
            views.storefront.innerHTML = `<div class="w-full text-center text-cyan-400 mt-20 flex flex-col items-center"><i class="fa-solid fa-circle-notch fa-spin text-4xl mb-4"></i><p class="text-lg">Fetching Apps from Network...</p></div>`;

            try {
                // Ensure Firebase module has finished loading
                while (!window.db || !window.getDocs || !window.collection) {
                    await new Promise(resolve => setTimeout(resolve, 50));
                }

                // Fetch real apps from Firestore "apps" collection
                const querySnapshot = await window.getDocs(window.collection(window.db, "apps"));
                const fetchedApps = [];
                querySnapshot.forEach((doc) => {
                    fetchedApps.push({ id: doc.id, ...doc.data() });
                });
                
                state.apps = fetchedApps;
            } catch (error) {
                console.error("Error loading from Firestore:", error);
                views.storefront.innerHTML = `<div class="w-full text-center text-red-500 mt-20"><p>Failed to connect to Nexus Database.</p><p class="text-sm mt-2 text-slate-400">${error.message}</p></div>`;
                return;
            }

            const appsToRender = state.apps;

            if (appsToRender.length === 0) {
                views.storefront.innerHTML = `<div class="w-full text-center text-slate-400 mt-20"><p>No apps found in the database yet.</p></div>`;
                return;
            }

            // Pick the first app as the featured banner app
            const featuredApp = appsToRender[0];
            const featuredName = featuredApp.name || featuredApp.title || 'Unknown App';
            const featuredDesc = featuredApp.description || featuredApp.desc || 'No description available.';

            let html = `
                <!-- Featured Banner -->
                <div class="w-full bg-gradient-to-r from-violet-900 to-indigo-900 rounded-2xl overflow-hidden shadow-lg border border-slate-700 relative h-64 flex items-center mb-8">
                    <div class="p-8 z-10 w-2/3">
                        <span class="bg-cyan-500 text-slate-900 text-xs font-bold px-2 py-1 rounded uppercase tracking-wide">Featured</span>
                        <h2 class="text-4xl font-bold mt-3 mb-2 text-white line-clamp-1">${featuredName}</h2>
                        <p class="text-slate-300 mb-6 line-clamp-2">${featuredDesc}</p>
                        <button class="bg-white text-slate-900 hover:bg-slate-200 font-semibold py-2 px-6 rounded-full transition-colors shadow-lg">Play Now</button>
                    </div>
                    <!-- Abstract geometric background shapes -->
                    <div class="absolute right-0 top-0 bottom-0 w-1/2 opacity-30 pointer-events-none" style="background-image: radial-gradient(circle at center, #c026d3 0%, transparent 70%);"></div>
                </div>

                <div class="w-full flex justify-between items-end mb-4">
                     <h3 class="text-xl font-semibold text-white tracking-wide">Recommended for you</h3>
                     <button class="text-cyan-400 hover:text-cyan-300 text-sm font-medium">See all</button>
                </div>

                <!-- Horizontal App Scroll -->
                <div class="w-full flex overflow-x-auto gap-4 pb-4 no-scrollbar scroll-smooth snap-x snap-mandatory">
            `;

            appsToRender.forEach(app => {
                // Safely grab fields regardless of what the user named them in the DB
                const appName = app.name || app.title || 'Untitled';
                const appDesc = app.description || app.desc || '';
                const appIcon = app.icon || app.image || app.imageUrl || app.logo || `https://placehold.co/200x200/1e293b/22d3ee?text=${appName.charAt(0).toUpperCase()}`;
                const appRating = app.rating || (Math.random() * (5.0 - 3.5) + 3.5).toFixed(1);

                html += `
                    <div class="flex-none w-36 sm:w-40 snap-start group cursor-pointer" onclick="alert('Open app: ${appName.replace(/'/g, "\\'")}')">
                        <!-- App Icon -->
                        <div class="w-full aspect-square rounded-2xl overflow-hidden shadow-md group-hover:shadow-cyan-500/20 transition-all duration-300 border border-slate-700 group-hover:border-cyan-500 relative bg-slate-800 flex items-center justify-center">
                             <img src="${appIcon}" alt="${appName} icon" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/200x200/1e293b/22d3ee?text=Error'">
                             <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-20 transition-all duration-200"></div>
                        </div>
                        
                        <!-- App Meta -->
                        <div class="mt-3">
                            <h4 class="text-sm font-medium text-slate-200 line-clamp-1 group-hover:text-cyan-400 transition-colors">${appName}</h4>
                            <p class="text-xs text-slate-500 line-clamp-1 mt-0.5">${appDesc}</p>
                            <div class="flex items-center gap-1 mt-1 text-xs text-slate-400">
                                <span>${appRating}</span>
                                <i class="fa-solid fa-star text-[10px]" style="color: #fbbf24;"></i>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            
            views.storefront.innerHTML = html;
        }

        // --- EVENT LISTENERS ---
        logoBtn.addEventListener('click', () => switchView('storefront'));

        // --- AUTHENTICATION LOGIC ---
        let isLoginMode = true;
        const authForm = document.getElementById('auth-form');
        const authEmail = document.getElementById('auth-email');
        const authPassword = document.getElementById('auth-password');
        const authSubmitBtn = document.getElementById('auth-submit-btn');
        const authToggleBtn = document.getElementById('auth-toggle-btn');
        const authToggleText = document.getElementById('auth-toggle-text');
        const authTitle = document.getElementById('auth-title');
        const authError = document.getElementById('auth-error');

        authToggleBtn.addEventListener('click', (e) => {
            e.preventDefault();
            isLoginMode = !isLoginMode;
            authTitle.innerText = isLoginMode ? "Sign in to Nexus" : "Create an Account";
            authSubmitBtn.innerText = isLoginMode ? "Login" : "Sign Up";
            authToggleText.innerText = isLoginMode ? "Don't have an account?" : "Already have an account?";
            authToggleBtn.innerText = isLoginMode ? "Sign up" : "Log in";
            authError.classList.add('hidden');
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            authError.classList.add('hidden');
            const email = authEmail.value;
            const password = authPassword.value;
            const originalBtnText = authSubmitBtn.innerText;
            authSubmitBtn.innerText = "Processing...";
            authSubmitBtn.disabled = true;

            try {
                if (isLoginMode) {
                    await window.signInWithEmailAndPassword(window.auth, email, password);
                } else {
                    await window.createUserWithEmailAndPassword(window.auth, email, password);
                }
                // Success - onAuthStateChanged will handle the redirect
            } catch (error) {
                console.error("Auth error:", error);
                authError.innerText = error.message.replace('Firebase: ', ''); // Clean up the error slightly
                authError.classList.remove('hidden');
            } finally {
                authSubmitBtn.innerText = originalBtnText;
                authSubmitBtn.disabled = false;
            }
        });

        // --- INITIALIZATION ---
        function init() {
            console.log("Nexus Store initialized.");
            
            // Wait for Firebase to load then setup Auth Listener
            const checkAuth = setInterval(() => {
                if (window.auth && window.onAuthStateChanged) {
                    clearInterval(checkAuth);
                    
                    window.onAuthStateChanged(window.auth, (user) => {
                        if (user) {
                            console.log("User logged in:", user.email);
                            state.currentUser = user;
                            
                            // Update header UI for logged-in user
                            const initial = user.email.charAt(0).toUpperCase();
                            authControlsContainer.innerHTML = `
                                <div class="flex items-center gap-4">
                                    <span class="text-sm text-slate-400 hidden sm:block">${user.email}</span>
                                    <div class="w-9 h-9 rounded-full bg-cyan-500 text-slate-900 flex items-center justify-center font-bold cursor-pointer hover:bg-cyan-400 transition-colors shadow-[0_0_10px_rgba(34,211,238,0.4)]" onclick="window.signOut(window.auth)" title="Sign Out">
                                        ${initial}
                                    </div>
                                </div>
                            `;
                            
                            // Route to store if they were just logging in
                            if (state.currentView === 'auth' || !state.currentView) {
                                switchView('storefront');
                            } else {
                                switchView(state.currentView);
                            }

                        } else {
                            console.log("No user logged in.");
                            state.currentUser = null;
                            authControlsContainer.innerHTML = `<button onclick="switchView('auth')" class="bg-slate-800 hover:bg-slate-700 text-white px-5 py-2 rounded-full text-sm font-medium border border-slate-700 transition-colors">Sign In</button>`;
                            switchView('auth'); // Force to login screen
                        }
                    });
                }
            }, 50);
        }

        // Start the app
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
